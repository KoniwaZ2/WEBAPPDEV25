<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>MyPrasmul</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div
      class="container-fluid main d-flex justify-content-start align-items-center"
      style="padding: 0"
    >
      <div class="col-6">
        <img
          src="Screenshot 2025-09-10 at 12.02.22.png"
          alt=""
          style="max-width: 100%; max-height: 100vh"
        />
      </div>
      <div class="col-6 align-items-center" style="padding: 10rem">
        <div class="welcome">
          <h1>Welcome</h1>
          <p class="lead mx-auto text-center fw-light" style="font-size: 16px">
            Please enter your login credentials
          </p>
        </div>
        <div class="form">
          <label for="Email" class="mt-3 mb-1">Email</label>
          <input
            type="email"
            id="Email"
            class="form-control form-custom"
            required
            placeholder="Masukkan email Anda"
          />
          <label for="Password" class="mt-4 mb-1">Password</label>
          <input
            type="password"
            id="Password"
            class="form-control form-custom"
            required
            placeholder="Masukkan password Anda"
          />
          <div
            class="additional-info d-flex justify-content-end align-items-center"
          >
            <a
              href="#"
              style="text-decoration: none; font-size: 15px"
              class="mt-3"
              ><i>Lupa Password</i></a
            >
          </div>
          <img
            src="Screenshot 2025-09-10 at 13.13.14.png"
            style="width: 100%"
            class="mt-3"
          />
          <input
            type="submit"
            value="MASUK"
            class="btn btn-primary btn-custom login mx-auto mt-3"
            style="width: 100%"
          />
          <p class="text-center p-daftar mt-3">
            Don't have an account? <a href="#" class="daftar">Sign Up</a>
          </p>
        </div>
        <div class="d-flex justify-content-start align-items-center">
          <i
            class="bi bi-exclamation-circle"
            style="font-size: 30px; margin-right: 8px"
          ></i>
          <p class="lead mb-0" style="font-size: 15px">
            Please use <b>Google Chrome</b> or <b>Mozilla Firefox</b> for best
            experience.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
